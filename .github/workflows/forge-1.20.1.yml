name: Forge 1.20.1 candidate

on:
  push:
    branches:
      - backport/forge-1.20.1-v3-current
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and verify on Linux
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --no-build-cache clean assembleForge1201CommunityCandidate --stacktrace --warning-mode all --console=plain

      - name: Build and verify on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat --no-daemon --no-build-cache clean assembleForge1201CommunityCandidate --stacktrace --warning-mode all --console=plain

      - name: Retain candidate for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forge1201-community-${{ runner.os }}
          path: |
            build/libs/tectonic-community-backport-1.20.1-forge-*.jar
            build/libs/tectonic-community-backport-1.20.1-forge-*.jar.sha256
          if-no-files-found: error
          retention-days: 7
